# Q4: Spark Standalone 클러스터 (master 1대 + worker 1대)
# Airflow compose와 같은 폴더에 있어서 프로젝트 이름을 따로 정해 둠
name: spark

services:
  spark-master:
    image: apache/spark:3.5.7-python3
    container_name: spark-master
    command: >
      bash -lc "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080"
    # Airflow가 8080을 쓰고 있어서 master Web UI는 호스트 9090으로 연결
    ports: ["7077:7077", "9090:8080"]
    volumes:
      - ./jobs:/opt/spark/work-dir   # 잡 스크립트
      - ./data:/opt/spark/data       # 입력 파일 (wordcount.txt)
    networks: [spark-network]

  spark-worker-1:
    image: apache/spark:3.5.7-python3
    container_name: spark-worker-1
    depends_on: [spark-master]
    command: >
      bash -lc "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 1 --memory 1G --webui-port 8081 spark://spark-master:7077"
    ports: ["8081:8081"]
    volumes:
      - ./jobs:/opt/spark/work-dir
      - ./data:/opt/spark/data       # worker도 같은 경로에서 입력 파일을 읽음
    networks: [spark-network]

networks:
  spark-network:
    driver: bridge
